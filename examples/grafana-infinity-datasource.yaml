# Grafana datasource for the perf-sentinel query API, via the Infinity plugin
# (yesoreyeram-infinity-datasource, install it first: it does not ship with
# Grafana). Pairs with examples/grafana-findings-dashboard.json.
#
# PIN THE PLUGIN VERSION where you provision it. The dashboard's `__requires`
# names 2.0.0, which is the floor Grafana's import dialog checks and not a
# statement about later majors. The plugin is on 4.x today. After a major bump,
# open the dashboard and check that all four tables still fill: their columns
# come from the backend parser, and a parser change empties a table without
# erroring anywhere.
#
# WHY THIS EXISTS. The Prometheus dashboard (examples/grafana-dashboard.json)
# answers "how many findings and of what kind": `perf_sentinel_findings_total`
# carries `type`, `severity`, (since 0.18.0) a capped `service` label and
# (since 0.19.0) a capped `grouping` label, but no per-endpoint label, which
# would blow up /metrics cardinality. It can never show you WHICH query on
# WHICH endpoint. That lives behind the query API, and this datasource is how
# Grafana reads it.
#
# NO PORT-FORWARD, NO INGRESS. Grafana's backend performs the request, so an
# in-cluster Grafana reaches the Service directly over the cluster network.
# Adjust the namespace below and nothing else needs exposing.
#
# TWO THINGS TO KNOW BEFORE YOU SHIP THIS.
#
# 1. The daemon has no embedded IAM. Anyone who can open this Grafana folder
#    reads your SQL templates and endpoint names. That is a data-exposure
#    decision, not a technical one: scope the folder accordingly, which
#    presumes a folder of its own. Restricting a shared folder that also holds
#    the cluster and database dashboards restricts all of those too, so the
#    usual answer is a dedicated folder rather than a narrower shared one.
# 2. If `networkPolicy.enabled=true` in the Helm chart, add Grafana as a peer
#    under `networkPolicy.ingress.fromNamespaceSelectors` or
#    `.fromPodSelectors`. Without it the datasource times out with no useful
#    error, because a NetworkPolicy denies silently.
#
# IF THE PANEL HANGS AND THEN 503s. Grafana's backend never reached the daemon,
# and neither the panel nor the response names why. Check the `url` below
# first: the port is the chart's `service.ports.otlpHttp.port`, 4318 unless you
# moved it, and the host needs its namespace unless Grafana runs in the same
# one. A wrong port fails this way, because nothing is there to refuse the
# connection. `allowedHosts` carries the same value and has to be corrected
# with it. The NetworkPolicy of point 2 is the other cause.
#
# IF THE INCIDENTS PANELS SAY 401. The key below is not the daemon's
# `[daemon] read_api_key`, or PERF_SENTINEL_READ_API_KEY is unset in Grafana's
# own environment. Ungated routes (/api/findings, /api/status, /api/energy)
# ignore the header, so the rest of the dashboard keeps working.
apiVersion: 1

datasources:
  - name: perf-sentinel API
    uid: perf-sentinel-api
    type: yesoreyeram-infinity-datasource
    # Base URL of the daemon's HTTP port (OTLP HTTP, query API, /metrics).
    # `perf-sentinel` is the chart's fullname, adjust for a release name or
    # nameOverride. Replace <ns> with the release namespace, and the port with
    # `service.ports.otlpHttp.port` if you moved it: the chart cross-checks
    # that value against `[daemon] listen_port_http`, this file is not in that
    # check.
    url: http://perf-sentinel.<ns>.svc.cluster.local:4318
    access: proxy
    isDefault: false
    jsonData:
      # One header on every request: X-API-Key carrying the READ key of the
      # daemon (`[daemon] read_api_key`, see secureJsonData below). Ungated
      # routes ignore it. GET /api/incidents needs it, and GET /api/acks takes
      # it too once `[daemon.ack] api_key` is set, as does every route once
      # `[daemon] require_read_key = true`, so one datasource serves every
      # panel. Keys per the plugin's provisioning schema (Infinity 4.x):
      # auth_method apiKey, apiKeyKey the header name, apiKeyType header.
      auth_method: apiKey
      apiKeyKey: X-API-Key
      apiKeyType: header
      # Pin the reachable host. Infinity requires it as soon as auth, custom
      # headers or TLS are configured, which is the case here, and refuses
      # every other host. Same value as `url`, corrected together.
      allowedHosts:
        - http://perf-sentinel.<ns>.svc.cluster.local:4318
      # The query API is loopback-fast, but a daemon under ingest pressure takes
      # longer than Grafana's default timeout to answer a 1000-finding page.
      timeoutInSeconds: 30
    secureJsonData:
      # `[daemon] read_api_key` (PERF_SENTINEL_READ_API_KEY on the daemon
      # side), the key that reads incidents and acks and can never POST,
      # DELETE or ack. NEVER the `[daemon.incidents] api_key` Alertmanager
      # posts with, nor the `[daemon.ack] api_key`: a Grafana folder must not
      # be able to fabricate an incident or ack a finding, and the daemon
      # refuses a read key equal to a write key at startup anyway. Grafana
      # expands `$__env{VAR}` from its own environment at provisioning time,
      # so mount the Secret into the Grafana pod (`envValueFrom` in the
      # Grafana chart) rather than writing the key into this file.
      apiKeyValue: $__env{PERF_SENTINEL_READ_API_KEY}

  # OPTIONAL, since 0.24.0. The `History (Hub)` row of the findings dashboard
  # reads PerfSentinelHub (0.3.0 and later) rather than the daemon, so that the
  # time picker reaches back as far as the Hub retains, 180 days by default.
  # Drop this block when no Hub is deployed: the row then errors when opened
  # and nothing else changes. Keep "Hub" in the name, the dashboard's
  # `perf-sentinel Hub` variable only offers datasources whose name carries it,
  # so that the row never binds to the daemon by accident.
  - name: perf-sentinel Hub
    uid: perf-sentinel-hub
    type: yesoreyeram-infinity-datasource
    # The Hub's Service, `perf-sentinel-hub` being its chart's fullname and
    # 8080 its port. Replace <ns> with the Hub's namespace.
    url: http://perf-sentinel-hub.<ns>.svc.cluster.local:8080
    access: proxy
    isDefault: false
    jsonData:
      # One header on every request: Authorization carrying a Hub machine
      # token, see secureJsonData below. With the Hub's access control on
      # (`hub.access.enabled`), GET /api/findings answers 401 without a
      # token and 403 when no grant gives the token's group findings.read,
      # while a token whose group is in `hub.access.adminGroups` reads
      # everything. Without access control the route takes no key and the
      # Hub ignores the header, so this block works there as is, the
      # variable unset: keep that Hub on the cluster network. Pinned because Infinity refuses a custom header
      # without `allowedHosts`, and so that the token only ever goes to the
      # Hub. Same value as `url`, corrected together. Over this http URL the
      # token crosses the pod network in clear: where that network is not
      # trusted, point both at the Hub's https ingress instead.
      httpHeaderName1: Authorization
      allowedHosts:
        - http://perf-sentinel-hub.<ns>.svc.cluster.local:8080
      timeoutInSeconds: 30
    secureJsonData:
      # A machine token declared in the Hub's `hub.access.machineTokens`,
      # whose value sits in a Secret (the Hub's docs/ACCESS-CONTROL.md). It
      # holds `findings.read` at most, whatever its group's grants say, so a
      # leaked dashboard configuration can never ack, start a run or read a
      # daemon view. Mount that Secret into the Grafana pod (`envValueFrom` in
      # the Grafana chart, the Secret copied into Grafana's namespace) rather
      # than writing the token here. ONE TOKEN PER TEAM: everyone who can
      # query this datasource reads whatever the token reaches, which in
      # Grafana OSS is every user of the organization, so a token granted on
      # `*` reopens every team's findings to all of them. Give each team a
      # token granted only its own projects, in that team's organization.
      httpHeaderValue1: Bearer $__env{PERF_SENTINEL_HUB_TOKEN}
