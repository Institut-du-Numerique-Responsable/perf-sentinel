# cargo-deny configuration for perf-sentinel.
#
# Read by `cargo deny check` (advisories, bans, licenses, sources). This is the
# supply-chain gate companion to `audit.toml` (which configures `cargo audit`).
# Schema targets cargo-deny 0.19.x.

[graph]
# License and ban analysis must see feature-gated dependencies too (daemon,
# tempo, jaeger-query, tui), so resolve the full feature set.
all-features = true

[advisories]
# Both rand versions in the tree (0.8.6 and 0.9.3) sit in RUSTSEC-2026-0097's
# patched range (>= 0.8.6 below 0.9.0, and >= 0.9.3 below 0.10.0), so the
# advisory matches nothing here. The withdrawn advisories on dirs, humantime and
# ring are not flagged either.
#
# The two ignores are unmaintained notices, not vulnerabilities, on crates that
# krilla 0.8.2, the latest release, pulls in behind the `pdf` feature. They shape
# and parse only the fonts embedded in the binary, never a font from outside.
# No release of krilla avoids them, so lift both once it moves to harfrust and
# skrifa.
ignore = [
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained, via krilla 0.8.2 (pdf feature), embedded fonts only, no fixed krilla release" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, via rustybuzz and krilla 0.8.2 (pdf feature), embedded fonts only, no fixed krilla release" },
]

[licenses]
# AGPL-3.0-only is copyleft. Every dependency below is license-compatible with
# it. The list is the exact set observed across the dependency graph, all
# permissive except MPL-2.0 (file-level weak copyleft, one-way compatible with
# AGPL) used by option-ext. LGPL-2.1-or-later is omitted because the only
# crate offering it (r-efi) is multi-licensed and resolves via MIT or Apache.
allow = [
    "AGPL-3.0-only",          # perf-sentinel and perf-sentinel-core themselves
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Unlicense",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

# The `card` feature rasterizes the share card with tiny-skia (BSD-3-Clause,
# pure Rust, `simd` off) and writes it with png (MIT OR Apache-2.0, pulling
# fdeflate), no C code. png 0.18.1 brings miniz_oxide 0.8.9 next to the 0.9.1
# that krilla's flate2 uses, the one duplicate the feature adds to
# `cargo tree -d -e normal -p perf-sentinel-core --features card`. The other
# pairs it lists (skrifa 0.42/0.49 with read-fonts and font-types, getrandom,
# rand, rand_core, syn, thiserror) were there before it.
# jixel (BSD-3-Clause OR Apache-2.0, pure Rust, default features and SIMD off)
# writes the JPEG XL card, no dependency; it holds `unsafe` code, reviewed as a
# supply-chain point. jxl-oxide and jxl decode it in one test only
# (dev-dependencies).
[bans]
# Several crates legitimately appear in multiple versions (transitive diamond
# dependencies), so duplicates are surfaced as warnings rather than failing the
# gate. Wildcard version requirements are rejected, except for the intra-
# workspace path dependency.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Every crate must come from crates.io. No git or alternative registry sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
