# perf-sentinel GitLab CI pipeline
#
# Runs perf-sentinel in batch mode against an integration-test trace fixture
# and publishes a Code Quality artifact so findings appear in the GitLab MR
# Code Quality widget. Uses --ci so the job fails when the quality gate is
# breached. A tooling failure (install, network) exits 75 and is excluded
# from blocking merge requests via `allow_failure.exit_codes`, see the
# `rules:` block of the `perf-sentinel` job.
#
# What you must adapt before using this template:
#   1. PERF_SENTINEL_VERSION: pin to an exact release tag (never use
#      'latest'). Review the CHANGELOG before each bump.
#   2. PERF_SENTINEL_TRACES: path to a trace file produced by your integration
#      test stage. Make sure your previous job (test stage) emits the trace
#      file as an artifact, then declare a `dependencies:` or `needs:` so the
#      file is restored into this job's workspace.
#   3. PERF_SENTINEL_CONFIG: path to your .perf-sentinel.toml. Tune the
#      [thresholds] section to set quality-gate severity floors. On OTLP
#      input, `min_usable_span_ratio` also fails the gate when the spans
#      arrive without the attributes the detectors need, so a broken
#      instrumentation cannot pass as a clean run.
#      The file must exist: `analyze --config` on a missing file exits 75,
#      which the report steps tolerate, so the job would pass with no
#      report at all. Commit the file, or drop `--config` to run on the
#      built-in defaults.
#   4. The `rules:` of `perf-sentinel-install`: they must select at least
#      every pipeline your test job runs in. A job missing from a pipeline
#      cannot be listed in `dependencies:`, and a job with no `rules:` is
#      left out of merge request pipelines. The final catch-all rule
#      already covers every pipeline, keep it unless your test job's rules
#      are narrower.
#
# The catch-all rules of `perf-sentinel-install` and `perf-sentinel` also
# mean that a branch with an open merge request runs two pipelines, a
# branch pipeline and a merge request pipeline, and GitLab warns about it.
# Choosing one is a project-wide `workflow:rules` decision, outside this
# template.
#
# See docs/CI.md (English) or docs/FR/CI-FR.md (French) for the full CI
# integration guide and the quality-gate philosophy.

stages:
  - test
  - perf-sentinel

variables:
  PERF_SENTINEL_VERSION: "0.36.0"
  PERF_SENTINEL_TRACES: "test-traces.json"
  PERF_SENTINEL_CONFIG: ".perf-sentinel.toml"

# Installs the binary once, in its own image, and hands it to the test and
# analyze jobs as an artifact. Test images often ship no curl
# (eclipse-temurin has neither curl nor wget), so an install inside the test
# job would fail before the tests run. The asset is statically linked and
# runs in any Linux image of the same architecture. When your runners mix
# architectures, give this job the test job's `tags:`.
perf-sentinel-install:
  stage: .pre
  image: debian:bookworm-slim
  script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates || exit 75
    - |
      # Exit code 75 (EX_TEMPFAIL, sysexits.h) marks a tooling problem here
      # (broken download, blocked egress, a runner architecture with no
      # release asset), not a quality-gate breach. `allow_failure` below lets
      # only this exact code through. Checksum verification below is a
      # separate script item and does NOT get this same exit-75 tolerance: a
      # mismatch means a tampered or corrupted release, not a tooling blip,
      # and must always block, on trunk and on merge requests alike.
      set -euo pipefail
      case "$(uname -m)" in
        x86_64) ASSET=perf-sentinel-linux-amd64 ;;
        aarch64|arm64) ASSET=perf-sentinel-linux-arm64 ;;
        *) echo "perf-sentinel: unsupported architecture $(uname -m)" >&2; exit 75 ;;
      esac
      BASE_URL="https://github.com/Institut-du-Numerique-Responsable/perf-sentinel/releases/download/v${PERF_SENTINEL_VERSION}"
      curl -sSLf -o "${ASSET}"     "${BASE_URL}/${ASSET}"     || exit 75
      curl -sSLf -o SHA256SUMS.txt "${BASE_URL}/SHA256SUMS.txt" || exit 75
    - |
      set -euo pipefail
      # Anchored on the file name, so no other line of SHA256SUMS.txt can
      # match. No line at all fails `sha256sum -c` too.
      grep "  ${ASSET}$" SHA256SUMS.txt | sha256sum -c -
      # Install under the project bin/ rather than /usr/local/bin so the
      # template works without elevated privileges on hardened runners,
      # and so the artifact below can carry it.
      mkdir -p "${CI_PROJECT_DIR}/bin"
      install -m 0755 "${ASSET}" "${CI_PROJECT_DIR}/bin/perf-sentinel"
      "${CI_PROJECT_DIR}/bin/perf-sentinel" --version
  allow_failure:
    exit_codes: [75]
  artifacts:
    paths:
      - bin/perf-sentinel
    expire_in: 1 day
  # Must select every pipeline your test job runs in (see item 4 at the
  # top). The final catch-all already does.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: on_success

# Place your integration-test job here. It must produce the trace file at
# $PERF_SENTINEL_TRACES and publish it as an artifact so the perf-sentinel
# job can pick it up via `dependencies:`. Most languages cannot write a trace
# file themselves, so `capture` receives OTLP over the network and writes one.
# PREFIX your existing test command with it, never add a second job, or the
# integration suite runs twice. See docs/INSTRUMENTATION.md.
#
# When the download failed there is no binary: the tests still run, without
# `capture`. The block sets no shell options, so your command runs as it did
# before. The output path starts from ${CI_PROJECT_DIR} because a `cd` in
# your script would move it, while `artifacts:paths` is relative to the
# project root. `when: always` keeps the capture when the tests fail.
# Example:
#
# integration-tests:
#   stage: test
#   dependencies:
#     - perf-sentinel-install
#   variables:
#     # Both are needed: SDKs disagree on the default protocol, and an
#     # endpoint on the wrong one exports nothing, silently.
#     OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
#     OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
#     OTEL_TRACES_SAMPLER: "always_on"
#   script:
#     - |
#       if [ -x "${CI_PROJECT_DIR}/bin/perf-sentinel" ]; then
#         "${CI_PROJECT_DIR}/bin/perf-sentinel" capture --output "${CI_PROJECT_DIR}/${PERF_SENTINEL_TRACES}" \
#           -- ./scripts/run-integration-tests.sh
#       else
#         ./scripts/run-integration-tests.sh
#       fi
#   artifacts:
#     when: always
#     paths:
#       - test-traces.json
#     expire_in: 1 day

perf-sentinel:
  stage: perf-sentinel
  image: debian:bookworm-slim
  dependencies:
    - perf-sentinel-install
    # - integration-tests   # uncomment once your test job exists
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends jq || exit 75
  script:
    # All commands invoke perf-sentinel via its absolute install path
    # so this template stays correct under GitLab executors that don't
    # propagate `before_script` PATH exports to the `script` block.
    # SARIF artifact for archive and inspection. Exits 75 on failure, same
    # tooling-vs-breach distinction as the install job above: a crash here
    # (missing binary after a failed download, malformed traces) is not a
    # quality-gate breach.
    - |
      "${CI_PROJECT_DIR}/bin/perf-sentinel" analyze \
        --input "${PERF_SENTINEL_TRACES}" \
        --config "${PERF_SENTINEL_CONFIG}" \
        --format sarif \
        > findings.sarif || exit 75
    # JSON report for downstream tooling and the Code Quality conversion.
    - |
      "${CI_PROJECT_DIR}/bin/perf-sentinel" analyze \
        --input "${PERF_SENTINEL_TRACES}" \
        --config "${PERF_SENTINEL_CONFIG}" \
        --format json \
        > perf-sentinel-report.json || exit 75
    # Convert findings to GitLab Code Quality format. GitLab expects an array
    # of {description, check_name, fingerprint, severity, location.path,
    # location.lines.begin}. The fingerprint is the finding's signature,
    # stable while the finding keeps its type, service, endpoint and
    # template (docs/ACKNOWLEDGMENTS.md), so GitLab can compare it with the
    # target branch's baseline. Findings sharing a signature show as one
    # entry. code_location field names match the v0.4.1 stable contract
    # (filepath, lineno, function, namespace, all without the `code_`
    # prefix). No exit-75 fallback here: a jq failure means a bug in this
    # filter (e.g. a future perf-sentinel release renaming a field it
    # reads), not a tooling blip. It should surface as a blocking failure
    # rather than get folded into the tooling-tolerant bucket above.
    - |
      set -euo pipefail
      jq '[
        .findings[] | {
          description: ("[" + .type + "] " + .suggestion),
          check_name: .type,
          fingerprint: .signature,
          severity: (
            if .severity == "critical" then "critical"
            elif .severity == "warning" then "major"
            else "info" end
          ),
          location: {
            path: (.code_location.filepath // "unknown"),
            lines: { begin: (if (.code_location.lineno // 0) > 0 then .code_location.lineno else 1 end) }
          }
        }
      ]' perf-sentinel-report.json > gl-code-quality-report.json
    # Re-run with --ci to enforce the quality gate. Exit code 1 if any
    # threshold is breached. This is the only command in this job allowed
    # to fail with its natural exit code, since it only runs after every
    # report-only step above already succeeded.
    - |
      "${CI_PROJECT_DIR}/bin/perf-sentinel" analyze \
        --ci \
        --input "${PERF_SENTINEL_TRACES}" \
        --config "${PERF_SENTINEL_CONFIG}" \
        --format json > /dev/null
  artifacts:
    when: always
    paths:
      - findings.sarif
      - perf-sentinel-report.json
    reports:
      codequality: gl-code-quality-report.json
    expire_in: 1 week
  # Philosophy: the gate blocks a merge request so the developer
  # still has a chance to fix before merge, but never blocks a
  # pipeline on the default branch. Code Quality widget + SARIF
  # artifact carry the signal for trunk runs. A red pipeline on
  # main would only keep the default branch red, demotivate the
  # team, and eventually push them to disable this job.
  #
  # `allow_failure.exit_codes` distinguishes the two ways this job can
  # fail: a tooling exit (75, see the install job and script above)
  # doesn't block the merge, while any other nonzero exit (the --ci
  # gate's own exit code on a real breach) still does. Without it, a
  # broken binary download would block a merge request exactly like a
  # regression.
  #
  # It sits on the job, not in a rule: `rules:allow_failure` accepts a
  # boolean only, and GitLab's CI lint rejects the whole file with
  # "rules:rule allow failure should be a boolean value" when a rule
  # carries the mapping form. The default-branch rule and the final
  # catch-all then override it with `true`, so only the merge request
  # rule can block. The catch-all runs the job, and archives its
  # artifacts, on every other pipeline too, such as a branch push with
  # no open merge request.
  #
  # `when: always` on each rule runs the job after failing tests, so the
  # report of a red test run is not lost.
  allow_failure:
    exit_codes: [75]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
      allow_failure: true
    - when: always
      allow_failure: true

# Free-tier compatible alternative: single Pages deployment on the
# default branch only. Publishes baseline.json AND an interactive
# HTML snapshot at the project Pages root. No per-MR deployment
# (pages.path_prefix requires Premium or Ultimate, see the note in
# docs/CI.md "Interactive report via GitLab Pages"). Use
# this block on gitlab.com Free tier or any self-hosted GitLab
# without the multi-deployment feature flag.
#
# Trade-off: MR reviewers see the trunk snapshot of the report, not
# their own MR's analysis. Still useful as a trend dashboard. Pick
# the path_prefix block below instead if you have Premium or
# Ultimate for per-MR interactive reports.
#
# Uncomment the whole block to enable. Pick either this block OR the
# path_prefix block below, not both (they would fight over the root
# deployment).
