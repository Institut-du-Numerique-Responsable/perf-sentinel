name: Sample disclosure

# Signs the sample disclosure the website shows, so a reader who downloads it
# gets TRUSTED from verify-hash rather than PARTIAL. The report is the G2
# example of docs/schemas/examples, a fictional company, moved to the version
# this run builds. Its attestation is the one `disclose --emit-attestation`
# writes, built here from the report itself.
#
# Each run writes one entry to the public Rekor log under this workflow's
# identity, so it only runs by hand.
on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: Where the website serves the Sigstore bundle
        required: true
        default: https://perf-sentinel.dev/exemple/disclosure/bundle.sig

permissions:
  contents: read

concurrency:
  group: sample-disclosure
  cancel-in-progress: false

jobs:
  sign:
    name: Sign the sample disclosure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Build perf-sentinel
        run: cargo build --release -p perf-sentinel --locked

      - name: Move the example to this version and bake its hash
        run: |
          set -euo pipefail
          bin=target/release/perf-sentinel
          version=$("$bin" --version | awk '{print $2}')
          mkdir -p work
          jq --arg v "$version" '
            .report_metadata.perf_sentinel_version = $v
            | .report_metadata.binary_version = $v
            | .methodology.perf_sentinel_version = $v
            | .aggregate.binary_versions = [$v]' \
            docs/schemas/examples/example-official-public-G2.json > work/unsigned.json
          "$bin" hash-bake --report work/unsigned.json --output work/unsigned.json

      - name: Write its attestation
        run: |
          set -euo pipefail
          # The predicate mirrors build_in_toto_statement in attestation.rs.
          core=$(jq -r '.methodology.core_patterns_required | sort | join(":")' work/unsigned.json \
            | tr -d '\n' | sha256sum | cut -d' ' -f1)
          jq -c --arg core "$core" '{
            _type: "https://in-toto.io/Statement/v1",
            predicateType: "https://perf-sentinel.io/attestation/v1",
            subject: [{name: "perf-sentinel-report.json",
                       digest: {sha256: (.integrity.content_hash | ltrimstr("sha256:"))}}],
            predicate: {
              perf_sentinel_version: .report_metadata.perf_sentinel_version,
              report_uuid: .report_metadata.report_uuid,
              period: {from_date: .period.from_date, to_date: .period.to_date},
              intent: .report_metadata.intent,
              confidentiality_level: .report_metadata.confidentiality_level,
              organisation: ({name: .organisation.name, country: .organisation.country}
                + ((.organisation.identifiers // {}) | with_entries(select(.value != null))
                   | if length > 0 then {identifiers: .} else {} end)),
              methodology_summary: {
                sci_specification: .methodology.sci_specification,
                conformance: .methodology.conformance,
                calibration_applied: .methodology.calibration_inputs.calibration_applied,
                period_coverage: .aggregate.period_coverage,
                core_patterns_count: (.methodology.core_patterns_required | length),
                enabled_patterns_count: ((.methodology.enabled_patterns // []) | length),
                disabled_patterns_count: ((.methodology.disabled_patterns // []) | length),
                core_patterns_hash: $core
              },
              subject_binding: "content_hash"
            }
          }' work/unsigned.json > work/attestation.intoto.jsonl

      - name: Sign the attestation keyless
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle work/bundle.sig --new-bundle-format \
            work/attestation.intoto.jsonl

      - name: Record the signature in the report
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
          BUNDLE_URL: ${{ inputs.bundle_url }}
        run: |
          set -euo pipefail
          index=$(jq -r '.verificationMaterial.tlogEntries[0].logIndex' work/bundle.sig)
          integrated=$(jq -r '.verificationMaterial.tlogEntries[0].integratedTime' work/bundle.sig)
          signed_at=$(date -u -d "@${integrated}" +%Y-%m-%dT%H:%M:%SZ)
          jq --arg id "$IDENTITY" --arg at "$signed_at" --argjson idx "$index" --arg url "$BUNDLE_URL" '
            .integrity.signature = {
              format: "sigstore-cosign-intoto-v1",
              bundle_url: $url,
              signer_identity: $id,
              signer_issuer: "https://token.actions.githubusercontent.com",
              rekor_url: "https://rekor.sigstore.dev",
              rekor_log_index: $idx,
              signed_at: $at
            }
            | .report_metadata.integrity_level = "signed"' work/unsigned.json > work/report.json

      - name: Render the PDF and require TRUSTED from it alone
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          bin=target/release/perf-sentinel
          "$bin" verify-hash --report work/report.json \
            --attestation work/attestation.intoto.jsonl --bundle work/bundle.sig \
            --expected-identity "$IDENTITY" \
            --expected-issuer https://token.actions.githubusercontent.com \
            | tee work/report-trusted.txt
          grep -q 'Overall: TRUSTED' work/report-trusted.txt
          "$bin" disclose-pdf --report work/report.json \
            --attestation work/attestation.intoto.jsonl --bundle work/bundle.sig \
            --expected-identity "$IDENTITY" \
            --expected-issuer https://token.actions.githubusercontent.com \
            --output work/report.pdf
          "$bin" verify-hash --report work/report.pdf \
            --expected-identity "$IDENTITY" \
            --expected-issuer https://token.actions.githubusercontent.com \
            | tee work/pdf-trusted.txt
          grep -q 'Overall: TRUSTED' work/pdf-trusted.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-disclosure
          path: |
            work/report.pdf
            work/report.json
            work/attestation.intoto.jsonl
            work/bundle.sig
            work/pdf-trusted.txt
          if-no-files-found: error
