  artifacthub.io/changes: |
    - kind: changed
      description: "appVersion 0.36.0. The SARIF output of perf-sentinel analyze reads again in Jenkins Warnings NG: a result carries a location only when it has a source file, and the service and endpoint move to the result properties, a breaking change for SARIF consumers. The daemon does not emit SARIF, so its behavior is unchanged. No values.yaml key is added or removed, and no template changes."
  artifacthub.io/images: |
