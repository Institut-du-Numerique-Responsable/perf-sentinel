apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.28.0
appVersion: "0.28.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel
icon: https://raw.githubusercontent.com/Institut-du-Numerique-Responsable/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/Institut-du-Numerique-Responsable/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel
    - name: Documentation
      url: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: security
      description: "The image picks up rustls 0.23.46 against RUSTSEC-2026-0346 to RUSTSEC-2026-0349. Only the unauthenticated ServerHello that could steer later connections to classical key exchange applies, to the shared outbound HTTP client."
    - kind: added
      description: "With [daemon.archive] configured, the image also writes one hash-chained line per UTC day beside the window archive, a few tens of KiB per day, kept rollup_retention_days (400 by default). disclose reads them, so a quarterly disclosure fits on the default claim. They land on the persistent volume with the archive."
    - kind: fixed
      description: "appVersion 0.28.0. The image's disclose --emit-attestation now names the report's canonical content hash as the attestation subject, and verify-hash checks that the attestation names the figures it is verifying, so a signature no longer vouches for figures edited after signing. No values.yaml key is added or removed, and no template changes."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/institut-du-numerique-responsable/perf-sentinel:0.28.0
      platforms:
        - linux/amd64
        - linux/arm64
