apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.32.0
appVersion: "0.32.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel
icon: https://raw.githubusercontent.com/Institut-du-Numerique-Responsable/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/Institut-du-Numerique-Responsable/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel
    - name: Documentation
      url: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: changed
      description: "appVersion 0.32.0. The daemon counts database and broker host energy inside the totals from [green.database_static], [green.broker_static] or Alumet, splits a node shared by several services, and adds grid operator carbon intensity feeds. Configs that declare [green.broker_static] without placement, or a host source without a region, now fail to load."
    - kind: added
      description: "With prometheusRule.energyScrapers, a PerfSentinelHostCpuProbeStale alert per host subsystem (database, broker) on the new *_cpu_last_scrape_age_seconds gauges. No values.yaml key is added or removed."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/institut-du-numerique-responsable/perf-sentinel:0.32.0
      platforms:
        - linux/amd64
        - linux/arm64
