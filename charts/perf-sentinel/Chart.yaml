apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.27.0
appVersion: "0.27.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel
icon: https://raw.githubusercontent.com/Institut-du-Numerique-Responsable/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/Institut-du-Numerique-Responsable/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel
    - name: Documentation
      url: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: added
      description: "appVersion 0.27.0. [daemon] require_read_key = true puts every GET of the query API behind [daemon] read_api_key (PERF_SENTINEL_READ_API_KEY) or the route's write key. Off by default, so nothing changes until it is set. With it on, every reader must send the key: the Hub source (AuthHeaderName=X-API-Key), Grafana datasources, perf-sentinel query, the live HTML report and the JetBrains plugin. The switch without a read key, or with [daemon.cors] allowed_origins = [\"*\"], stops the pod at startup."
    - kind: changed
      description: "The values.yaml comments on the ingress and on the config readers describe require_read_key. No values.yaml key is added or removed, and no template changes."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/institut-du-numerique-responsable/perf-sentinel:0.27.0
      platforms:
        - linux/amd64
        - linux/arm64
