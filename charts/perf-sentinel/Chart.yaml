apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.30.0
appVersion: "0.30.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel
icon: https://raw.githubusercontent.com/Institut-du-Numerique-Responsable/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/Institut-du-Numerique-Responsable/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel
    - name: Documentation
      url: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: added
      description: "appVersion 0.30.0. With [daemon.hub_export] and [daemon.correlation] both enabled, the image pushes its cross-trace correlations to PerfSentinelHub's /api/import/correlations as episodes, each period during which a pair kept co-occurring, so a correlation outlives the rolling window. Upgrade the Hub to 0.6.0 first: an older Hub with sign-in on answers 401, which the daemon retries and logs. New label-free metrics perf_sentinel_hub_export_correlations_pending and perf_sentinel_hub_export_correlations_dropped_total."
    - kind: changed
      description: "The values.yaml comment on [daemon.hub_export] says correlation episodes travel through the same block. No values.yaml key is added or removed, and no template changes."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/institut-du-numerique-responsable/perf-sentinel:0.30.0
      platforms:
        - linux/amd64
        - linux/arm64
