apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.31.2
appVersion: "0.31.2"
kubeVersion: ">=1.24.0-0"
home: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel
icon: https://raw.githubusercontent.com/Institut-du-Numerique-Responsable/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/Institut-du-Numerique-Responsable/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel
    - name: Documentation
      url: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/Institut-du-Numerique-Responsable/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: added
      description: "appVersion 0.31.2. The daemon's tuning advisor and query monitor name what the Hub export dropped, and /api/config reports whether the export is on."
    - kind: added
      description: "PrometheusRule gains PerfSentinelHubExportDropping, on the findings, incidents and correlations the export dropped, which the Hub's long history then lacks."
    - kind: fixed
      description: "PerfSentinelArchiveDropping now fires on a single dropped window: its rate spans 30 minutes, past its 15-minute for. No values.yaml key is added or removed."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/institut-du-numerique-responsable/perf-sentinel:0.31.2
      platforms:
        - linux/amd64
        - linux/arm64
