{{- if .Values.prometheusRule.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "perf-sentinel.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.prometheusRule.namespace }}
  labels:
    {{- include "perf-sentinel.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: perf-sentinel.rules
      rules:
        # Every rule below alerts on data the daemon lost and cannot recover.
        # Saturation, cardinality and correlator eviction are dashboard panels
        # instead: see docs/METRICS.md.
        - alert: PerfSentinelDown
          expr: up{job="{{ include "perf-sentinel.fullname" . }}"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "perf-sentinel daemon is not being scraped"
            description: "No scrape has succeeded for 15m, which at the chart's 15s interval is 60 consecutive failures, well past any rolling update. Every other rule here is a rate() that reads 0 on a dead process, so this is what keeps the rest from disarming silently."
        - alert: PerfSentinelIngestRejecting
          expr: rate(perf_sentinel_otlp_rejected_total{reason="channel_full"}[10m]) > 0.05
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "perf-sentinel is dropping OTLP requests, the ingest channel is saturated"
            description: "Spans the daemon accepted and then dropped, so the findings that follow are incomplete with no marker saying so. Raise daemon.ingest_queue_capacity or limits.cpu."
        - alert: PerfSentinelMemoryPressureRejecting
          expr: perf_sentinel_ingest_memory_pressure == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "perf-sentinel is rejecting ingest under memory pressure"
            description: "The daemon is refusing ingest to keep RSS under the cgroup limit, so it never OOMKills and no cluster rule reports it. State-based, so it stays firing even after exporters stop retrying: raise resources.limits.memory or add replicas."
        - alert: PerfSentinelAnalysisShedding
          expr: rate(perf_sentinel_analysis_shed_traces_total[10m]) > 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "perf-sentinel is shedding traces before analysis"
            description: "Roughly 900 traces dropped before detection ever ran, and the report that follows carries no marker naming what was skipped. Raise daemon.analysis_queue_capacity or limits.cpu."
        - alert: PerfSentinelArchiveDropping
          expr: rate(perf_sentinel_archive_windows_dropped_total[30m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "perf-sentinel dropped a disclosure archive window"
            description: "The archive hash chain stays contiguous across a drop, so verify-hash recomputes clean over a record that is short and this counter is the only witness. No floor here, unlike the rules above: the unit is a whole scoring window. The 30m window outlasts the 15m `for`, so a single dropped window fires."
        - alert: PerfSentinelHubExportDropping
          expr: (rate(perf_sentinel_hub_export_dropped_total[30m]) + rate(perf_sentinel_hub_export_incidents_dropped_total[30m]) + rate(perf_sentinel_hub_export_correlations_dropped_total[30m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "perf-sentinel dropped findings, incidents or correlations bound for PerfSentinelHub"
            description: "What the daemon could not deliver to the Hub leaves a gap in the Hub's long history that the daemon cannot refill, its ring buffer having moved on. Silent while the Hub export is off. Raise the hub_export max_pending or request_timeout_secs, upgrade a Hub that answers 404 on the incident or correlation route, and look for rejected batches in the daemon log. No floor and a 30m window: the unit is a whole finding, incident or episode, and a single drop fires."
        {{- if .Values.prometheusRule.energyScrapers }}
        {{- $stale := .Values.prometheusRule.scraperStaleSeconds }}
        {{- range $backend := list "alumet" "scaphandre" "kepler" "redfish" "cloud_energy" }}
        - alert: PerfSentinelEnergyScraperStale
          expr: perf_sentinel_{{ $backend }}_last_scrape_age_seconds > {{ $stale }}
          for: 5m
          labels:
            severity: warning
            backend: {{ $backend }}
          annotations:
            summary: "perf-sentinel {{ $backend }} energy scraper is stale"
            description: "perf_sentinel_{{ $backend }}_last_scrape_age_seconds exceeded {{ $stale }}s: the {{ $backend }} energy backend produced no fresh sample. Carbon attribution falls back to the proxy model."
        {{- end }}
        {{- range $subsystem := list "database" "broker" }}
        - alert: PerfSentinelHostCpuProbeStale
          expr: perf_sentinel_{{ $subsystem }}_cpu_last_scrape_age_seconds > {{ $stale }}
          for: 5m
          labels:
            severity: warning
            subsystem: {{ $subsystem }}
          annotations:
            summary: "perf-sentinel {{ $subsystem }} host CPU probe is stale"
            description: "perf_sentinel_{{ $subsystem }}_cpu_last_scrape_age_seconds exceeded {{ $stale }}s: the cpu_query of the {{ $subsystem }} hosts returned no fresh single series. A dedicated declaration falls back to its SPECpower ceiling, a shared one bills no host energy."
        {{- end }}
        {{- end }}
        {{- with .Values.prometheusRule.additionalRules }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
