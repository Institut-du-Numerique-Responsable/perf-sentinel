    <script>
        /* Resolves the theme before the first paint. tokens.css defines its palettes
           under [data-theme], so a root without the attribute has no variables at all
           and the page would flash unstyled. The stored position may be auto, light or
           dark; only the resolved light or dark ever reaches the DOM. */
        (function () {
            let stored = null;
            try {
                /* sessionStorage first: the dashboard writes the same key, so a theme
                   chosen over there comes back here within the tab. */
                stored = sessionStorage.getItem('perf-sentinel:theme') || localStorage.getItem('perf-sentinel:theme');
            } catch (e) {
                stored = null;
            }
            const position = stored === 'light' || stored === 'dark' ? stored : 'auto';
            let theme = position;
            if (position === 'auto')
                theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.dataset.theme = theme;
            document.documentElement.dataset.themePosition = position;
        })();
    </script>

    var pct = Math.max(0, Math.min(100, value / g.capacity * 100));
    return { value: value, capacity: g.capacity, pct: Math.round(pct * 10) / 10,
             at_capacity: pct >= 90 };
  }

  function daemonView(path) {
    var body = shift(ROUTES[path]);
    var n = reads[path] = (reads[path] || 0) + 1;
    var step = WALK[(n - 1) % WALK.length];
    body.traces = gauge(body.traces, step);
    body.analysis_queue = gauge(body.analysis_queue, Math.round(step / 3));
    body.findings = gauge(body.findings, n % 3 === 0 ? 1 : 0);
    // Uptime follows the wall clock rather than the read count, so it stays
    // truthful whether the reader refreshes every five seconds or leaves the
    // row open.
    if (typeof body.uptime_seconds === 'number') {
      body.uptime_seconds += Math.floor((Date.now() - LOAD) / 1000);
    }
    body.observed_at_ms = Date.now();
    return body;
  }

  // A submitted run is carried through the states the launcher's own poll
  // expects, reusing a real succeeded run for the terminal body.
  var submitted = {};
  var submits = 0;
  var SUBMIT_HISTORY = 20;
  var TEMPLATE = null;
  for (var key in ROUTES) {
    if (key.indexOf('/api/analyses/') === 0 && ROUTES[key] && ROUTES[key].status === 'succeeded') {
      TEMPLATE = ROUTES[key];
      break;
    }
  }

  var SOURCES = ROUTES['/api/sources'] || [];
  function sourceOf(id) {
    for (var i = 0; i < SOURCES.length; i++) if (SOURCES[i].id === id) return SOURCES[i];
    return null;
  }

  // Every state is derived from the captured succeeded run rather than built by
  // hand. A run carries fifteen fields and the screens read most of them, so a
  // hand-built pending body prints "read from undefined" for the one it forgot.
  function run(id) {
    var started = submitted[id];
    var age = Date.now() - started.at;
    var status = age < 1500 ? 'pending' : (age < 4000 ? 'running' : 'succeeded');
    var body = shift(TEMPLATE);
    var src = sourceOf(started.sourceId);
    body.id = id;
    body.status = status;
    body.created_at_ms = started.at;
    body.started_at_ms = status === 'pending' ? null : started.at + 1500;
    body.finished_at_ms = status === 'succeeded' ? started.at + 4000 : null;
    body.request = started.request;
    if (src) {
      body.source_id = src.id;
      body.source_name = src.name;
      body.environment = src.environment;
      body.kind = src.kind;
      body.producer_version = status === 'succeeded' ? src.producer_version : null;
    }
    if (status !== 'succeeded') {
      body.result = null;
      body.expires_at_ms = null;
    }
    return body;
  }

  function json(body) {
    return Promise.resolve(new Response(JSON.stringify(body), {
      status: 200, headers: { 'content-type': 'application/json' }
    }));
  }

  var realFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var target;
    try { target = new URL(url, location.href); } catch (e) { return realFetch(input, init); }
    // Same origin only. Stripping any host would let a request to another origin
    // be answered from a fixture whose path happened to match.
    if (target.origin !== location.origin) return realFetch(input, init);
    var path = target.pathname + target.search;
    var method = ((init && init.method) || 'GET').toUpperCase();

    if (method === 'POST' && path.indexOf('/api/analyses') === 0) {
      var payload = {};
      try { payload = JSON.parse((init && init.body) || '{}'); } catch (e) {}
      var id = 'f' + String(++submits).padStart(15, '0');
      submitted[id] = { at: Date.now(), sourceId: payload.source_id, request: payload.request };
      // Only the run being watched is ever read back, so a short tail is enough
      // and the map cannot grow for the life of the page. Keys are insertion
      // ordered here because none of them looks like an array index.
      var held = Object.keys(submitted);
      if (held.length > SUBMIT_HISTORY) delete submitted[held[0]];
      return json({ id: id, status: 'pending' });
    }

    var match = path.match(/^\/api\/analyses\/([0-9a-f]{16})$/);
    if (match && submitted[match[1]]) return json(run(match[1]));

    if (path.indexOf('/api/sources/') === 0 && path.indexOf('/daemon') !== -1) {
      var key = path.split('?')[0];
      return ROUTES[key] ? json(daemonView(key))
                         : Promise.resolve(new Response('{}', { status: 404 }));
    }

    // The correlations screen asks for its range and filters in the query, so the
    // captured episodes are filtered here the way the Hub's store would.
    if (path.indexOf('/api/correlations?') === 0) {
      var q = new URLSearchParams(path.split('?')[1]);
      var service = q.get('service'), sourceId = q.get('source_id'), pairKey = q.get('pair_key');
      var from = Number(q.get('from')) || 0;
      return json(shift(ROUTES['/api/correlations']).filter(function (e) {
        return (e.ended_at_ms === null || e.last_seen_ms >= from)
          && (!service || e.source.service === service || e.target.service === service)
          && (!sourceId || e.source_id === sourceId)
          && (!pairKey || e.pair_key === pairKey)
          && (q.get('active') !== 'true' || e.ended_at_ms === null);
      }).slice(0, Number(q.get('limit')) || undefined));
    }

    // The ack card's windowed read takes from and to off the clock, so the capture
    // holds it once under window=7d and answers it for any from and to.
    if (path.indexOf('/api/findings?') === 0) {
      var w = new URLSearchParams(path.split('?')[1]);
      var windowKey = '/api/findings?signature=' + encodeURIComponent(w.get('signature') || '')
        + '&window=7d&limit=' + w.get('limit');
      if (w.has('from') && w.has('to') && ROUTES[windowKey]) return json(shift(ROUTES[windowKey]));
    }

    var pdf = path.match(/^\/api\/disclosures\/([0-9a-f]{16})\/files\/report\.pdf$/);
    if (pdf && PDFS.indexOf(pdf[1]) !== -1) return realFetch('files/' + pdf[1] + '.pdf');

    if (ROUTES[path]) return json(shift(ROUTES[path]));
    // The launcher asks for exactly the routes the fixtures carry. Anything else
    // is a change upstream, and answering it with a plausible empty body would
    // hide that.
    if (path.indexOf('/api/') === 0) {
      return Promise.resolve(new Response('{}', { status: 404 }));
    }
    return realFetch(input, init);
  };

  // The report screen is an iframe, not a read, so fetch never sees it. The site
  // already hosts the engine's dashboard, so the demo closes on itself.
  new MutationObserver(function (records) {
    for (var i = 0; i < records.length; i++) {
      var added = records[i].addedNodes;
      for (var j = 0; j < added.length; j++) {
        var node = added[j];
        if (!node.querySelectorAll) continue;
        var frames = node.tagName === 'IFRAME' ? [node] : node.querySelectorAll('iframe');
        for (var k = 0; k < frames.length; k++) {
          var src = frames[k].getAttribute('src') || '';
          if (src.indexOf('/reports/') === 0) frames[k].setAttribute('src', '/exemple/dashboard');
        }
        // A frozen recap report is a link to a page the site serves beside this one.
        var links = node.tagName === 'A' ? [node] : node.querySelectorAll('a[href^="/recaps/"]');
        for (var l = 0; l < links.length; l++) {
          var href = links[l].getAttribute('href') || '';
          if (href.indexOf('/recaps/') === 0) links[l].setAttribute('href', href.slice(1));
        }
      }
    }
  }).observe(document.documentElement, { childList: true, subtree: true });

  // The launcher resolves its theme in a blocking script at the top of <head>,
  // so by the time this runs it has already read an empty store and fallen back
  // to prefers-color-scheme. Writing the store alone would apply on the next
  // load and leave a light launcher inside a dark page now, so the attribute is
  // set outright. This is where the launcher differs from the dashboard, whose
  // own resolution runs from an IIFE at the end of body.
  // The site owns the theme in a frame, and the launcher's own control reads its
  // label from application state this patch does not reach. Hidden rather than
  // fought, the same choice the dashboard embed makes.
  if (window.self !== window.top) {
    try {
      var hide = document.createElement('style');
      hide.textContent = '#theme-toggle{display:none!important}';
      (document.head || document.documentElement).appendChild(hide);
    } catch (e) {}
  }

  var initial = (location.search.match(/[?&]theme=(dark|light)(?:&|$)/) || [])[1];
  if (initial) {
    document.documentElement.setAttribute('data-theme', initial);
    document.documentElement.setAttribute('data-theme-position', initial);
    try {
      sessionStorage.setItem('perf-sentinel:theme', initial);
      localStorage.setItem('perf-sentinel:theme', initial);
    } catch (e) {}
  }

  // The launcher has no postMessage listener of its own, and neither store
  // crosses an origin, so the parent's theme arrives here and nowhere else.
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    var t = e.data && e.data.psTheme;
    if (t !== 'light' && t !== 'dark') return;
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.setAttribute('data-theme-position', t);
    try { sessionStorage.setItem('perf-sentinel:theme', t); } catch (_) {}
  });
})();
</script>
</head>
<body>
<header class="shell-topbar">
    <a aria-label="Perf Sentinel Hub, new analysis" class="shell-wordmark" href="#/new">
        <img alt="Perf Sentinel" data-logo="light" src="logo-horiz-light.svg">
        <img alt="Perf Sentinel" data-logo="dark" src="logo-horiz-dark.svg">
        <span class="shell-wordmark-suffix">hub</span>
    </a>

    <nav aria-label="Screens" class="shell-tabs">
        <a class="shell-tab" data-screen="new" href="#/new">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="1.9" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M10 8.5l6 3.5-6 3.5z"></path>
            </svg>
            New analysis
        </a>
        <a class="shell-tab" data-screen="recent" href="#/recent">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="1.9" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 7v5l3.5 2"></path>
            </svg>
            Recent
        </a>
        <a class="shell-tab" data-screen="sources" href="#/sources">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="1.9" viewBox="0 0 24 24">
                <ellipse cx="12" cy="6" rx="7.5" ry="3"></ellipse>
                <path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"></path>
                <path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"></path>
            </svg>
            Sources
            <span class="shell-tab-badge" hidden id="sources-badge"></span>
        </a>
        <a class="shell-tab" data-screen="incidents" href="#/incidents">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="1.9" viewBox="0 0 24 24">
                <path d="M3 13.5h4l2.5-6 4 11 2.5-5H21"></path>
            </svg>
            Incidents
        </a>
        <a class="shell-tab" data-screen="correlations" href="#/correlations">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="1.9" viewBox="0 0 24 24">
                <circle cx="6" cy="7" r="2.5"></circle>
                <circle cx="18" cy="17" r="2.5"></circle>
                <path d="M8.2 8.6l7.6 6.8"></path>
            </svg>
            Correlations
        </a>
        <a class="shell-tab" data-screen="recap" href="#/recap">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="1.9" viewBox="0 0 24 24">
                <path d="M5 20V10"></path>
                <path d="M10 20V5"></path>
                <path d="M15 20v-7"></path>
                <path d="M20 20v-3"></path>
                <path d="M3 20h18"></path>
            </svg>
            Recap
        </a>
        <a class="shell-tab" data-screen="disclosures" hidden href="#/disclosures">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="1.9" viewBox="0 0 24 24">
                <path d="M7 3h7l4 4v14H7z"></path>
                <path d="M14 3v4h4"></path>
                <path d="M10 13h5M10 17h5"></path>
            </svg>
            Disclosures
        </a>
        <a class="shell-tab" data-screen="coverage" hidden href="#/coverage">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="1.9" viewBox="0 0 24 24">
                <path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z"></path>
                <path d="M9 12l2.2 2.2L15.5 10"></path>
            </svg>
            Coverage
        </a>
    </nav>

    <div class="shell-cluster">
        <div class="shell-version" id="version-chip">
            <span class="shell-version-label">hub</span>
            <span class="shell-version-value" id="version-hub">…</span>
            <span aria-hidden="true" class="shell-version-rule"></span>
            <span class="shell-version-label">engine</span>
            <span class="shell-version-value" id="version-engine">…</span>
        </div>

        <!-- A link to #/access once the Hub answers /api/access, plain text otherwise:
             app.js sets the href, and an <a> without one is not focusable. -->
        <a class="shell-identity" id="identity"
           title="Established by the Hub's sign-in, or by the reverse proxy in front of it. There is no account to manage here.">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="1.9" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="3.6"></circle>
                <path d="M4.8 20c.9-3.6 3.8-5.4 7.2-5.4s6.3 1.8 7.2 5.4"></path>
            </svg>
            <span id="identity-name"></span>
        </a>

        <button aria-live="polite" class="shell-theme" id="theme-toggle" type="button">
            <span aria-hidden="true" class="shell-theme-glyph" id="theme-glyph"></span>
            <span id="theme-label">System</span>
        </button>
    </div>
</header>

<main class="shell-main" id="main"></main>

<footer class="shell-footer">
  <span class="shell-credit">Powered by
    <a href="https://perf-sentinel.dev/" rel="noopener noreferrer" target="_blank">Perf Sentinel</a>
    &middot; design &amp; logo by
    <a href="https://www.linkedin.com/in/gwendoline-meignen-b0224873/" rel="noopener noreferrer" target="_blank">Gwendoline Meignen</a>
  </span>
</footer>

<script src="launcher.js"></script>
<script src="app.js"></script>
</body>
</html>
